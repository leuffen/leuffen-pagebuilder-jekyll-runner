services:
  rabbitmq:
    image: rabbitmq:4
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${AMQP_USER:-runner}
      RABBITMQ_DEFAULT_PASS: ${AMQP_PASSWORD:-runner}
      RABBITMQ_DEFAULT_VHOST: ${AMQP_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    image: leuffen-pagebuilder-jekyll-runner:local
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: ${RUNNER_STOP_GRACE_PERIOD:-11m}
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USER: ${AMQP_USER:-runner}
      AMQP_PASSWORD: ${AMQP_PASSWORD:-runner}
      AMQP_VHOST: ${AMQP_VHOST:-/}
      AMQP_EXCHANGE: ${AMQP_EXCHANGE:-leuffen.jekyll.v1}
      AMQP_QUEUE: ${AMQP_QUEUE:-leuffen.jekyll.v1.requests}
      AMQP_ROUTING_KEY: ${AMQP_ROUTING_KEY:-rpc.request}
      AMQP_RECONNECT_DELAY: ${AMQP_RECONNECT_DELAY:-30}
      JEKYLL_BUILD_TIMEOUT: ${JEKYLL_BUILD_TIMEOUT:-300}
    volumes:
      - ./data/source:/source:ro
      - ./data/target:/target
    read_only: true
    tmpfs:
      - /tmp

  cdn:
    image: leuffen-pagebuilder-jekyll-runner-cdn:local
    build:
      context: .
      target: cdn
    profiles: [cdn]
    restart: unless-stopped
    environment:
      CDN_HOST_PATTERN: ${CDN_HOST_PATTERN:-*.localhost}
    ports:
      - "${CDN_PORT:-8080}:80"
    volumes:
      - ./data/target:/target:ro
    read_only: true
    tmpfs:
      - /tmp
