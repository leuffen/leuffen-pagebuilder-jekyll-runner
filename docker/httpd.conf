ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule vhost_alias_module modules/mod_vhost_alias.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule rewrite_module modules/mod_rewrite.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
TypesConfig conf/mime.types
AddType text/html .html
DirectoryIndex index.html
EnableSendfile Off

<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory /target>
    AllowOverride None
    Options -Indexes -ExecCGI -Includes -FollowSymLinks +MultiViews
    Require all granted
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Directory>

# Internal publishing/lock directories and dotfiles are never public assets.
<DirectoryMatch "(^|/)\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>

Header always set X-Content-Type-Options nosniff
Header always unset X-Powered-By

# The first vhost catches hosts outside the configured tenant domain.
<VirtualHost *:80>
    ServerName denied.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias ${CDN_HOST_PATTERN}
    UseCanonicalName Off
    VirtualDocumentRoot /target/%1

    # Accept ordinary DNS hostnames only; a tenant is the first label.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?::[0-9]{1,5})?$ [NC]
    RewriteRule ^ - [F]
</VirtualHost>
