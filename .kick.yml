version: 1
from: "ghcr.io/nfra-project/kickstart-flavor-php:8.4"
ports: "80:80"

packages: [jekyll, rsync, git, unzip, ruby-zip,
  ruby-jekyll-sass-converter, ruby-jekyll-optional-front-matter,
  ruby-jekyll-sitemap, ruby-jekyll-seo-tag, ruby-jekyll-feed]

config_file:
  template: "config.php.dist"
  target: "config.php"

command:
  build:
    - "sudo a2dismod php8.5"
    - "sudo a2enmod headers rewrite vhost_alias negotiation"
    - >-
      php -r 'if (PHP_VERSION_ID < 80500) { throw new RuntimeException("PHP >= 8.5 required"); } foreach (["pcntl", "posix", "sockets", "mbstring"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing extension: " . $extension); } }'
    - "sudo mkdir -p /source /target /tmp/jekyll-runner"
    - "sudo chown user:user /source /target /tmp/jekyll-runner"
    - "sudo curl -fsSL https://getcomposer.org/composer-stable.phar -o /usr/local/bin/composer"
    - "sudo chmod 755 /usr/local/bin/composer"
    - "composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader"
  run:
    - "if [ \"${RUNNER_ROLE:-worker}\" = \"worker\" ]; then php /opt/bin/worker.php; fi"
