services:
  rabbitmq:
    image: rabbitmq:4
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: runner
      RABBITMQ_DEFAULT_PASS: runner
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  builder:
    image: ghcr.io/leuffen/leuffen-jekyll-builder:unstable
    restart: unless-stopped

  worker:
    image: leuffen-pagebuilder-preview:local
    build:
      context: ..
      dockerfile: container/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: ${RUNNER_STOP_GRACE_PERIOD:-11m}
    depends_on:
      rabbitmq:
        condition: service_healthy
      builder:
        condition: service_started
    environment:
      CONF_AMQ_CONNECTION: ${CONF_AMQ_CONNECTION:-rabbitmq://runner:runner@rabbitmq:5672/}
      PREVIEW_BUILDER_URL: http://builder
      CDN_HOST_PATTERN: ${CDN_HOST_PATTERN:-*.localhost}
      PREVIEW_RELOAD_JS_URL: ${PREVIEW_RELOAD_JS_URL:-}
    ports:
      - "${CDN_PORT:-8080}:80"
    volumes:
      - ../data/source:/source:ro
      - ../data/target:/target

