# Kickstart Apache loads shared modules and MIME types from Ubuntu configuration.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" runner_common
CustomLog /proc/self/fd/1 runner_common
DirectoryIndex index.html
EnableSendfile Off


<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory /target>
    AllowOverride None
    Options -Indexes -ExecCGI -Includes -FollowSymLinks +MultiViews
    Require method GET HEAD
</Directory>

# Internal publishing/lock directories and dotfiles are never public assets.
<DirectoryMatch "(^|/)\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>

Header always set X-Content-Type-Options nosniff
Header always unset X-Powered-By

# The first vhost catches hosts outside the configured tenant domain.
<VirtualHost *:80>
    ServerName denied.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias ${CDN_HOST_PATTERN}
    UseCanonicalName Off
    VirtualDocumentRoot /target/%1

    # Accept ordinary DNS hostnames only; a tenant is the first label.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?::[0-9]{1,5})?$ [NC]
    RewriteRule ^ - [F]
</VirtualHost>
