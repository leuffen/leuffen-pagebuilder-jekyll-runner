name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build worker
        uses: docker/build-push-action@v7.4.0
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        with:
          context: .
          target: worker
          load: true
          tags: leuffen-pagebuilder-jekyll-runner:local
          secret-envs: composer_auth=COMPOSER_AUTH
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Build CDN
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: cdn
          load: true
          tags: leuffen-pagebuilder-jekyll-runner-cdn:local
          cache-from: type=gha,scope=cdn
          cache-to: type=gha,scope=cdn,mode=max
      - name: Check PHP and Apache syntax
        run: |
          docker run --rm --entrypoint sh leuffen-pagebuilder-jekyll-runner:local -c 'find /app/src /app/bin -name "*.php" -print0 | xargs -0 -n1 php -l'
          docker run --rm --entrypoint httpd leuffen-pagebuilder-jekyll-runner-cdn:local -t
          docker compose --profile cdn config --quiet
      - name: Verify RabbitMQ builds and static CDN
        run: |
          mkdir -p data/source/demo data/target
          sudo chown 1000:1000 data/target
          printf 'title: Runner smoke\n' > data/source/demo/_config.yml
          printf '%s\n' '---' '---' '<h1>{{ site.title }}</h1>' > data/source/demo/index.html
          docker compose --profile cdn up --detach --no-build --wait --wait-timeout 90

          cat > "$RUNNER_TEMP/build-request.php" <<'PHP'
          <?php
          require '/app/vendor/autoload.php';
          use PhpAmqpLib\Connection\AMQPStreamConnection;
          use PhpAmqpLib\Message\AMQPMessage;
          $connection = new AMQPStreamConnection(getenv('AMQP_HOST'), 5672, getenv('AMQP_USER'), getenv('AMQP_PASSWORD'), getenv('AMQP_VHOST'));
          $channel = $connection->channel();
          $exchange = getenv('AMQP_EXCHANGE');
          $queue = getenv('AMQP_QUEUE');
          $key = getenv('AMQP_ROUTING_KEY');
          $channel->exchange_declare($exchange, 'topic', false, true, false);
          $channel->queue_declare($queue, false, true, false, false);
          $channel->queue_bind($queue, $exchange, $key);
          [$replyQueue] = $channel->queue_declare('', false, false, true, true);
          $id = bin2hex(random_bytes(8));
          $response = null;
          $channel->basic_consume($replyQueue, '', false, true, false, false, function (AMQPMessage $message) use (&$response, $id) {
              if ($message->get('correlation_id') !== $id) {
                  throw new RuntimeException('Incorrect correlation_id');
              }
              $response = json_decode($message->getBody(), true, 512, JSON_THROW_ON_ERROR);
          });
          $request = ['version' => 1, 'id' => $id, 'method' => 'build', 'params' => ['source' => 'demo', 'target' => 'demo']];
          $channel->basic_publish(new AMQPMessage(json_encode($request, JSON_THROW_ON_ERROR), ['content_type' => 'application/json', 'delivery_mode' => 2, 'correlation_id' => $id, 'reply_to' => $replyQueue]), $exchange, $key);
          while ($response === null) {
              $channel->wait(null, false, 60);
          }
          $expected = getenv('EXPECT_OK') === '1';
          if (($response['ok'] ?? null) !== $expected || ($response['id'] ?? null) !== $id || (!$expected && ($response['error']['code'] ?? null) !== 'BUILD_FAILED')) {
              throw new RuntimeException(json_encode($response));
          }
          echo json_encode($response, JSON_UNESCAPED_SLASHES), PHP_EOL;
          $channel->close();
          $connection->close();
          PHP

          docker compose exec -T -e EXPECT_OK=1 worker php < "$RUNNER_TEMP/build-request.php"
          grep -q 'Runner smoke' data/target/demo/index.html
          sha256sum data/target/demo/index.html > "$RUNNER_TEMP/published.sha256"

          printf '%s\n' '---' '---' '{% definitely_not_a_liquid_tag %}' > data/source/demo/index.html
          docker compose exec -T -e EXPECT_OK=0 worker php < "$RUNNER_TEMP/build-request.php"
          sha256sum --check "$RUNNER_TEMP/published.sha256"

          curl --fail --silent --show-error -H 'Host: demo.localhost' http://localhost:8080/ | grep -q 'Runner smoke'
          curl --fail --silent --show-error --head -H 'Host: demo.localhost' http://localhost:8080/ > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Host: unknown.example' http://localhost:8080/)" = 403
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST -H 'Host: demo.localhost' http://localhost:8080/)" = 403
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Host: demo.localhost' http://localhost:8080/.runner-locks/)" = 403
      - name: Show service logs
        if: always()
        run: docker compose --profile cdn logs --no-color
      - name: Stop services
        if: always()
        run: docker compose --profile cdn down --volumes
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified development images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker tag leuffen-pagebuilder-jekyll-runner:local "$IMAGE:unstable"
          docker tag leuffen-pagebuilder-jekyll-runner-cdn:local "$IMAGE:cdn-unstable"
          docker push "$IMAGE:unstable"
          docker push "$IMAGE:cdn-unstable"
