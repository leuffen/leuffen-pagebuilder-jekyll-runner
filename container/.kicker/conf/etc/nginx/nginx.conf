<?php

declare(strict_types=1);

// Apache-Hostmuster behalten ihre Bedeutung, auch mit mehreren Aliasnamen.
$hostPatterns = preg_split('/\s+/', trim(getenv('CDN_HOST_PATTERN') ?: '*.localhost'));
$hostExpressions = [];
foreach ($hostPatterns as $hostPattern) {
    if (!preg_match('/\A[A-Za-z0-9.*?-]+\z/', $hostPattern)) {
        throw new RuntimeException('CDN_HOST_PATTERN must contain hostname patterns separated by whitespace');
    }
    $hostExpressions[] = str_replace(['\\*', '\\?'], ['.*', '.'], preg_quote(strtolower($hostPattern), '~'));
}
$hostExpression = '~^(?:' . implode('|', $hostExpressions) . ')$';

// Der Filter gilt nur für statisches HTML, niemals für Nchan-Nachrichten.
$reloadFilter = '';
$reloadUrl = getenv('PREVIEW_RELOAD_JS_URL');
if ($reloadUrl !== false && $reloadUrl !== '') {
    if (
        !preg_match('~\Ahttps?://[A-Za-z0-9._:/?#\[\]@!$&\'()*+,;=%-]+\z~i', $reloadUrl)
        || !parse_url($reloadUrl, PHP_URL_HOST)
    ) {
        throw new RuntimeException('PREVIEW_RELOAD_JS_URL must be an absolute HTTP(S) URL');
    }
    // HTML entities preserve the URL while preventing Nginx variable expansion.
    $htmlUrl = str_replace('$', '&#36;', htmlspecialchars($reloadUrl, ENT_QUOTES, 'UTF-8'));
    $reloadFilter = "            sub_filter '</body>' '<script src=\"$htmlUrl\"></script></body>';\n"
        . "            sub_filter_once off;\n";
}
?>
user user;
worker_processes auto;
worker_shutdown_timeout 2s;
pid /run/nginx.pid;
error_log /dev/stderr warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    absolute_redirect off;

    # Preview pages and errors must never be cached.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;

    # Nchan shares messages between workers in this Nginx instance only.
    nchan_use_redis off;
    limit_conn_zone $binary_remote_addr zone=preview_subscribers:10m;

    map $http_host $preview_host_valid {
        default 0;
        "~*^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?::[0-9]{1,5})?$" 1;
    }

    map $host $preview_site {
        default "";
        ~^(?<preview_site_label>[^.]+)\. $preview_site_label;
    }

    map $uri $preview_html {
        volatile;
        default "";
        "~^(?<preview_html_stem>/(?:.*/)?[^/.]+)/?$" $preview_html_stem.html;
    }

    map $arg_channel $preview_channel_valid {
        default 0;
        "~^[A-Za-z0-9_-]{1,128}$" 1;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name denied.invalid;
        return 403;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name "<?= $hostExpression ?>";
        root /target/$preview_site;
        index index.html;
        autoindex off;
        disable_symlinks on;
        error_page 404 @preview_not_found;

        if ($preview_host_valid = 0) {
            return 403;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403;
        }

        location = /__preview/events {
            access_log off;
            if ($preview_channel_valid = 0) {
                return 400;
            }
            limit_conn preview_subscribers 5;
            limit_conn_status 429;
            nchan_subscriber websocket eventsource longpoll;
            nchan_channel_id $arg_channel;
            nchan_subscriber_first_message newest;
            nchan_websocket_ping_interval 30;
            nchan_eventsource_ping_interval 30;
            nchan_eventsource_ping_comment keepalive;
        }

        location ~ (^|/)\. {
            return 403;
        }

        # A slash prefers index.html, then the extensionless sibling's HTML.
        location ~ /$ {
<?= $reloadFilter ?>
            try_files ${uri}index.html $preview_html @preview_static;
        }

        # An exact regular file wins; flat HTML also wins over a directory.
        location / {
<?= $reloadFilter ?>
            try_files $uri $preview_html @preview_static;
        }

        # Keep native directory redirects, missing-file 404s and access 403s.
        location @preview_static {
<?= $reloadFilter ?>
        }

        location @preview_not_found {
            # Only test existence here; never serve content with checks off.
            # Nginx can report blocked symlink ancestors as missing paths.
            disable_symlinks off;
            if (-e $request_filename) {
                return 403;
            }
            if (-f $document_root$preview_html) {
                return 403;
            }
            # Resume protected static handling, retaining the original 404.
            rewrite ^ /404.html last;
        }
    }

    # Only the local RabbitMQ worker can publish. This port is never exposed.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        client_max_body_size 64k;

        location = /publish {
            access_log off;
            allow 127.0.0.1;
            deny all;
            if ($request_method != POST) {
                return 405;
            }
            if ($preview_channel_valid = 0) {
                return 400;
            }
            nchan_publisher http;
            nchan_channel_id $arg_channel;
        }

        location / {
            return 404;
        }
    }
}
