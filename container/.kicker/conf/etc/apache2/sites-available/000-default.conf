# The Kickstart init command creates this marker only when reload is configured.
IncludeOptional /run/leuffen-preview/enabled.conf

# Catch all unknown hosts before the project virtual host.
<VirtualHost *:80>
    ServerName denied.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias ${CDN_HOST_PATTERN}
    UseCanonicalName Off
    VirtualDocumentRoot /target/%1
    DirectoryIndex index.html

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /target>
        AllowOverride None
        Options -Indexes -ExecCGI -Includes -FollowSymLinks +MultiViews
        Require method GET HEAD
    </Directory>

    <IfDefine PREVIEW_RELOAD>
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|</body>|<script src=\"/__preview_reload.js\"></script></body>|ni"

        Alias "/__preview_reload.js" "/run/leuffen-preview/reload.js"
        <Directory "/run/leuffen-preview">
            AllowOverride None
            Options -Indexes -ExecCGI -Includes -FollowSymLinks
            Require method GET HEAD
            <Files "reload.js">
                ForceType application/javascript
                Header always set Cache-Control "no-store"
            </Files>
        </Directory>
    </IfDefine>

    # Internal publishing directories and hidden files are never served.
    <DirectoryMatch "(^|/)\.">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>

    Header always set X-Content-Type-Options nosniff
    Header always unset X-Powered-By

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?::[0-9]{1,5})?$ [NC]
    RewriteRule ^ - [F]
</VirtualHost>
