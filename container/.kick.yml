version: 1
from: "ghcr.io/nfra-project/kickstart-flavor-php:8.4"
ports: "80:80"

packages: [unzip, nginx, libnginx-mod-nchan, php8.5-curl]

config_file:
  template: "config.php.dist"
  target: "config.php"

command:
  build:
    - "sudo rm -f /kickstart/run/start.d/10-start-apache.sh /kickstart/run/stop.d/10-stop-apache.sh"
    - >-
      php -r 'if (PHP_VERSION_ID < 80500) { throw new RuntimeException("PHP >= 8.5 required"); } foreach (["pcntl", "posix", "sockets", "mbstring", "zip", "curl"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing extension: " . $extension); } }'
    - "sudo mkdir -p /source /target"
    - "sudo chown user:user /source /target"
    - "sudo curl -fsSL https://getcomposer.org/composer-stable.phar -o /usr/local/bin/composer"
    - "sudo chmod 755 /usr/local/bin/composer"
    - "composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader"
  run:
    - "php /opt/bin/worker.php"
